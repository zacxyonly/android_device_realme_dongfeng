#
# WCNSS Configuration for Qualcomm SM6650 (dongfeng)
#

# Operating Mode
gChannelBondingMode5GHz=1
gChannelBondingMode24GHz=0
gEnableDFSChnlScan=1

# Power Save
gEnableModulatedDTIM=2
gMaxLIModulatedDTIM=6

# Fast Transition (802.11r)
FastRoamEnabled=1
RoamRssiDiff=5

# Band Steering & Concurrency
gEnableConcurrentSTA=wlan0
gDot11Mode=0

# WPA3 & SAE
sae_pwe=1
